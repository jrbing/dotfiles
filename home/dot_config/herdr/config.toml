
onboarding = false

[terminal]
default_shell = "/bin/bash"

[theme]
name = "solarized"

[keys]
prefix = "ctrl+f"

rename_tab = "prefix+n"
previous_tab = "prefix+comma"
next_tab = "prefix+."
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

copy_mode = ["prefix+[", "prefix+esc", "prefix+up", "prefix+backtick"]

split_vertical = ["prefix+|", "prefix+\\"]

resize_pane_left = "prefix+ctrl+j"
resize_pane_down = "prefix+ctrl+k"
resize_pane_up = "prefix+ctrl+i"
resize_pane_right = "prefix+ctrl+l"

[ui]
copy_on_select = false
prompt_new_tab_name = false
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
tab_bar_position = "bottom"

tab_bar_right = [
  { type = "command", command = "/bin/bash ~/.tmux/kube.tmux", interval_seconds = 60, timeout_seconds = 2 },
  { type = "hostname" },
]
tab_bar_right_separator = " | "

window_title = "{hostname} ❐ {workspace} ● {tab}"

[ui.toast]
delivery = "system"
delay_seconds = 1

[experimental]
pane_history = false

[worktrees]
directory = "~/.herdr/worktrees"

[remote]
manage_ssh_config = true
