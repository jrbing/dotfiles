<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="pipeTitle pipeDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif">
  <title id="pipeTitle">dotfiles bootstrap pipeline</title>
  <desc id="pipeDesc">A bare macOS, Ubuntu or Omarchy machine runs setup.sh, which installs chezmoi and applies the home/ source into $HOME, producing a configured zsh, vim, tmux and git environment. mise owns runtimes and dev CLIs; sheldon installs zsh plugins.</desc>

  <!--
    INTENTIONAL hardcoded palette and hand-tuned coordinates (cyberpunk / vaporwave).
    Do NOT theme these hex values away. Dashed-connector animation is decorative;
    the diagram reads complete as a static frame (GitHub does not play SVG animation).
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#25e6ff"/>
    </marker>
  </defs>

  <style>
    .flow{stroke-dasharray:7 9;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="310" rx="20" fill="#0b0910"/>
  <text x="56" y="52" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#25e6ff">HOW IT WORKS</text>

  <!-- connectors -->
  <g stroke="#25e6ff" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <path class="flow" d="M266 136 H286"/>
    <path class="flow" d="M502 136 H522"/>
    <path class="flow" d="M748 136 H768"/>
  </g>
  <g stroke="#6b6480" stroke-width="2" fill="none">
    <path d="M638 184 V206"/>
    <path d="M638 206 H989"/>
    <path d="M670 206 V224"/>
    <path d="M989 206 V224"/>
  </g>
  <text x="650" y="200" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" fill="#6b6480">configured by home/</text>

  <!-- top row -->
  <g>
    <rect x="56" y="88" width="210" height="96" rx="12" fill="#14101f" stroke="#25e6ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="80" y="126" font-size="24" font-weight="700" fill="#f3edff">bare OS</text>
    <text x="80" y="152" font-size="17" fill="#8b81a6">macOS &#183; Ubuntu</text>
    <text x="80" y="174" font-size="17" fill="#8b81a6">Omarchy 4.x</text>

    <rect x="292" y="88" width="210" height="96" rx="12" fill="#14101f" stroke="#ff2d95" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="316" y="126" font-size="24" font-weight="700" fill="#f3edff">setup.sh</text>
    <text x="316" y="152" font-size="17" fill="#8b81a6">curl | bash</text>
    <text x="316" y="174" font-size="17" fill="#8b81a6">installs chezmoi</text>

    <rect x="528" y="88" width="220" height="96" rx="12" fill="#14101f" stroke="#25e6ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="552" y="126" font-size="24" font-weight="700" fill="#f3edff">chezmoi apply</text>
    <text x="552" y="152" font-size="17" fill="#8b81a6">home/ source</text>
    <text x="552" y="174" font-size="17" fill="#8b81a6">&#8594; $HOME</text>

    <rect class="pulse" x="774" y="88" width="360" height="96" rx="12" fill="#171226" stroke="#b8ff2e" stroke-width="2"/>
    <text x="798" y="126" font-size="24" font-weight="700" fill="#f3edff">configured shell</text>
    <text x="798" y="152" font-size="17" fill="#c9ff74">zsh &#183; vim &#183; tmux &#183; git</text>
    <text x="798" y="174" font-size="17" fill="#8b81a6">142 files managed</text>
  </g>

  <!-- support row -->
  <g>
    <rect x="520" y="224" width="300" height="62" rx="12" fill="#14101f" stroke="#b8ff2e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="544" y="256" font-size="20" font-weight="700" fill="#f3edff">mise</text>
    <text x="544" y="276" font-size="16" fill="#8b81a6">runtimes + dev CLIs</text>

    <rect x="844" y="224" width="290" height="62" rx="12" fill="#14101f" stroke="#b8ff2e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="868" y="256" font-size="20" font-weight="700" fill="#f3edff">sheldon</text>
    <text x="868" y="276" font-size="16" fill="#8b81a6">6 zsh plugins</text>
  </g>
</svg>
